  .lpp-top{width:100%;display:flex;flex-direction:column;align-items:center;padding:36px 20px 16px;position:relative;}

<script>
(function(){
  const U="Goodlucky", P="9999", KEY="hengdee_limepinkpurple_fixed";
  const lock=document.getElementById("lock-screen-limepinkpurple");
  const root=document.getElementById("root");
  const iu=document.getElementById("lpp-user"), ip=document.getElementById("lpp-pass"), btn=document.getElementById("lpp-login"), err=document.getElementById("lpp-err");
  const showApp=()=>{lock.style.display="none"; if(root) root.style.display=""; document.body.style.overflow="";};
  const showLock=()=>{if(root) root.style.display="none"; lock.style.display="flex";};
  const login=()=>{if(iu.value.trim()===U && ip.value.trim()===P){localStorage.setItem(KEY,"1"); showApp();}else{err.style.display="block"; ip.value="";}};
  if(localStorage.getItem(KEY)==="1") showApp(); else showLock();
  btn.addEventListener("click", login);
  iu.addEventListener("keydown", e=>{ if(e.key==="Enter") ip.focus(); });
  ip.addEventListener("keydown", e=>{ if(e.key==="Enter") login(); });
  // ซ่อนป้าย Netlify ที่อาจถูก inject มาทีหลัง
  setInterval(()=>{document.querySelectorAll('a,div,span').forEach(el=>{if(el.textContent && el.textContent.includes('Powered by Netlify')){el.style.display='none';}});}, 1000);
})();
</script>

<script>
(function(){
  function createChonBox(){
    // Remove old if exists
    let old = document.getElementById('chon-box-external');
    if(old) old.remove();
    
    // Find pinned container: element containing "รายการปักหมุด"
    let pinnedHeader = null;
    let all = document.querySelectorAll('div, h3, span');
    for(let el of all){
      if(el.textContent && el.textContent.includes('รายการปักหมุด')){
        // Find the card container
        let card = el.closest('div.bg-white');
        if(card){
          pinnedHeader = card;
          break;
        }
      }
    }
    if(!pinnedHeader) return;
    
    // Compute most frequent digits from visible formula cards (สูตรคงที่)
    // Look for elements with id starting with pin- or containing combo
    let freq = {};
    for(let i=0;i<10;i++) freq[i]=0;
    let cards = document.querySelectorAll('[id^="pin-"]');
    if(cards.length===0){
      // fallback: look for divs that contain big digits
      cards = document.querySelectorAll('div.bg-white.rounded-\[20px\]');
    }
    let hasData = false;
    cards.forEach(card=>{
      let txt = card.textContent||"";
      // Try to find combo like 0123456789 inside card's big number
      // The big number is in element with style color #2B6CB0 or font size 32px
      let big = card.querySelector('div[style*="32px"], span[style*="32px"]');
      let digits = "";
      if(card.id && card.id.startsWith('pin-')){
        digits = card.id.replace('pin-','');
      } else if(big){
        digits = big.textContent.replace(/\s/g,'');
      }
      if(digits && /^[0-9]{4,10}$/.test(digits)){
        let seen={};
        for(let ch of digits){
          if(!seen[ch]){ freq[ch]=(freq[ch]||0)+1; seen[ch]=1; hasData=true; }
        }
      }
    });
    
    // If still no data, try to get from all visible cards text
    if(!hasData){
      // Show default from image
      freq = {'0':5,'4':5,'9':4,'3':4,'1':4,'5':3,'2':3,'6':3};
    }
    
    let arr = Object.keys(freq).map(k=>({d:k,c:freq[k]})).filter(x=>x.c>0).sort((a,b)=>b.c-a.c);
    // Read selected count from filter - must match exactly e.g. "1 ตัว"
    let selectedCount = 6;
    try{
      let filterCards = document.querySelectorAll('div.bg-white');
      for(let card of filterCards){
        let txtCard = (card.textContent||'');
        // Filter card has both "รอบ" and "ตัว"
        if(txtCard.includes('รอบ') && txtCard.includes('ตัว')){
          let btns = card.querySelectorAll('button');
          for(let b of btns){
            let t = (b.textContent||'').trim();
            let m = t.match(/^(\d+)\s*ตัว$/);
            if(m){
              selectedCount = parseInt(m[1],10);
              break;
            }
          }
          if(selectedCount!==6) break;
          // fallback scan any element inside card
          let allInside = card.querySelectorAll('*');
          for(let el of allInside){
            if(el.children.length===0){
              let t = (el.textContent||'').trim();
              let m = t.match(/^(\d+)\s*ตัว$/);
              if(m){
                selectedCount = parseInt(m[1],10);
                break;
              }
            }
          }
          if(selectedCount!==6) break;
        }
      }
    }catch(e){}
    if(arr.length>selectedCount) arr = arr.slice(0,selectedCount);
    
    let box = document.createElement('div');
    box.id='chon-box-external';
    box.className='bg-white rounded-[20px] border border-[#E9E2FF] shadow-[0_8px_24px_rgba(124,58,237,0.06)] p-5 mt-3';
    box.innerHTML = `
      <div style="text-align:center;font-size:15px;font-weight:bold;color:#7C3AED;letter-spacing:0.5px;">-- เลขชนกันมากที่สุด --</div>
      <div style="margin-top:12px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;">
        ${arr.map(x=>`<span style="font-size:32px;font-weight:900;color:#44CE02;line-height:1;letter-spacing:2px;">${x.d}</span>`).join('')}
      </div>
    `;
    
    // Insert after pinned container
    pinnedHeader.parentNode.insertBefore(box, pinnedHeader.nextSibling);
  }
  
  // Run after load and on tab changes
  setTimeout(createChonBox, 800);
  setTimeout(createChonBox, 2000);
  // Watch for DOM changes (when filter changes, new cards loaded)
  let observer = new MutationObserver(()=>{ setTimeout(createChonBox, 300); });
  observer.observe(document.body, {childList:true, subtree:true});
  
  // Also run on click of filter buttons
  document.addEventListener('click', ()=>{ setTimeout(createChonBox, 500); });
})();
</script>
